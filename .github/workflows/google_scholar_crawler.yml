name: Update Google Scholar citations
on:
  workflow_dispatch:
  schedule:
    # 01:00 Beijing time on Monday, Tuesday and Friday.
    - cron: '0 17 * * 0,1,4'
permissions:
  contents: read
concurrency:
  group: google-scholar-stats
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install crawler dependency
        run: python -m pip install -r google_scholar_crawler/requirements.txt
      - name: Fetch and validate citation count
        env:
          GOOGLE_SCHOLAR_ID: '-YuCzI0AAAAJ'
          OUTPUT_DIR: ${{ runner.temp }}/scholar-results
        run: python google_scholar_crawler/main.py
      - name: Publish successful snapshot to data branch
        env:
          RESULTS_DIR: ${{ runner.temp }}/scholar-results
          DATA_DIR: ${{ runner.temp }}/scholar-branch
          REPO_TOKEN: ${{ github.token }}
          REPO_NAME: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$DATA_DIR"
          cd "$DATA_DIR"
          git init
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git remote add origin "https://github.com/${REPO_NAME}.git"
          auth_header="$(printf 'x-access-token:%s' "$REPO_TOKEN" | base64 -w 0)"
          git config http.https://github.com/.extraheader "AUTHORIZATION: basic ${auth_header}"
          if git ls-remote --exit-code --heads origin google-scholar-stats; then
            git fetch --depth=1 origin google-scholar-stats
            git checkout -b google-scholar-stats FETCH_HEAD
          else
            git checkout --orphan google-scholar-stats
          fi
          cp "$RESULTS_DIR/gs_data.json" "$RESULTS_DIR/gs_data_shieldsio.json" .
          git add gs_data.json gs_data_shieldsio.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Update Google Scholar citation data'
          git push origin HEAD:google-scholar-stats
